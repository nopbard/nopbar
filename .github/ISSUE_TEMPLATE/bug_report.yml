name: Bug report
description: Something in NopBar does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the taskbar is missing, run `nopbar.exe --restore-taskbar` (or restart Explorer) first.
        **Security problems:** please email nopbard@gmail.com instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NopBar version
      description: Settings > About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver`. For example "Windows 11 24H2 (26100.2605)".
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Number of monitors and their scaling (DPI), dock position, light/dark, other shell tools (StartAllBack, ExplorerPatcher, TranslucentTB, ...).
  - type: textarea
    id: log
    attributes:
      label: dock.log
      description: |
        Open `%APPDATA%\NopBar\dock.log` (paste that path into the Explorer address bar) and paste the last 50–100 lines from around the time of the problem.
        The log holds window titles and app paths from your PC, so look it over and remove anything you do not want to share.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images or a short clip here.
