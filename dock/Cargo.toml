[package]
name = "dock"
license = "GPL-3.0-only"
version = "0.1.114"
edition = "2021"

[[bin]]
name = "nopbar"
path = "src/main.rs"

[dependencies]
nopbar-mcp = { path = "../companion-mcp" }
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "io-util", "macros"] }
futures-util = "0.3"
jsonwebtoken = "9"
toml_edit = "0.22"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
windows-core = "0.62.2"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = ["ApplicationModel", "ApplicationModel_DataTransfer", "Foundation", "Foundation_Numerics", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Graphics_DirectX", "Graphics_Effects", "Win32_System_WinRT_Graphics_Direct2D", "System", "UI", "UI_Composition", "UI_Composition_Desktop", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_Storage_EnhancedStorage", "Win32_UI_Accessibility", "Win32_Graphics_DirectWrite", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_System_Variant", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Graphics_Imaging", "Win32_Storage_Xps", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls_RichEdit", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_NetworkManagement_WiFi", "Win32_System_Shutdown", "Win32_System_RestartManager", "Devices_Enumeration", "Devices_Bluetooth", "Media_Devices", "Win32_Devices_FunctionDiscovery", "Win32_Media_KernelStreaming", "Devices_Radios", "Media_Control", "Storage_Streams", "Win32_System_Wmi", "Graphics", "Graphics_Capture", "Security_Authorization_AppCapabilityAccess", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Input_Ime", "Win32_UI_Input", "Win32_Networking_WinHttp", "UI_Notifications", "Data_Xml_Dom", "Win32_System_Performance", "Wdk_System_SystemInformation", "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Ioctl", "UI_Shell", "Networking", "Networking_Connectivity", "Networking_NetworkOperators", "System_Power", "ApplicationModel_Appointments"] }
windows-numerics = "0.3"
