[workspace]
members = ["dock", "setup", "companion-mcp", "spikes/*"]
resolver = "2"

# Debug builds keep file:line for panics and backtraces, not full debug info
# (target size). Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
