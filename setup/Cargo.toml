[package]
name = "nopbar-setup"
license = "GPL-3.0-only"
# Not the app version: the exe's version resource carries dock's version
# (build.rs reads dock/Cargo.toml), so a release bumps one file.
version = "0.0.0"
edition = "2021"
publish = false
description = "The NopBar setup window: a drag-to-install front end around the Inno Setup installer"

[lib]
name = "nopbar_setup"
path = "src/lib.rs"

[[bin]]
name = "nopbar-setup"
path = "src/main.rs"

[dependencies]
windows-core = "0.62.2"
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
# dock/locales/*.json -> the setup.* strings (build.rs).
serde_json = "1.0.154"

[dev-dependencies]
# Tests read the locale files the table came from.
serde_json = "1.0.154"
